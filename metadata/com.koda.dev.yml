AutoName: Koda Dev
Summary: On-device AI coding agent & full Linux development environment.
Description: |-
  Koda Dev is an Android-native autonomous AI coding agent and complete
  Linux development environment powered by Ubuntu 24.04 LTS and PRoot.

  Turn your Android device into a self-contained software engineering
  workstation capable of building, testing, and editing code on-device.

  Key Features:
  * Autonomous Coding Agent with multi-turn tool calling and visual diff review
  * Authentic Ubuntu 24.04 LTS userland in PRoot with apt package manager
  * VT100 terminal engine with 24-bit truecolor and mobile programmer keyboard
  * Connect to local models (Ollama, Antiroute) or remote APIs (Claude, OpenAI, DeepSeek)
  * Web search and documentation lookup tools
  * 100% Free & Open Source under GPL-3.0 with no ads, tracking, or proprietary analytics

RepoType: git
