Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0.0
    subdir: app
    gradle:
      - yes
    init:
      # Remove bundled arm64 AAPT2 binary so F-Droid's precompiled binary scanner passes
      - rm -rf tools/bin
    prebuild:
      - sed -i -e '/tools\/bin\/arm64-v8a\/aapt2/d' ../settings.gradle.kts

  - versionName: '1.1.0'
    versionCode: 2
